<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.H. Miraz | Profile</title>
    <style>
        /* আগের সব স্টাইল এখানে থাকবে, শুধু নিচের নতুন স্টাইলগুলো যোগ করো */
        
        /* Active Status Style */
        #activeStatus { display: none; color: #31a24c; font-size: 13px; font-weight: 600; margin-top: 2px; }
        .green-dot { width: 10px; height: 10px; background: #31a24c; border-radius: 50%; display: inline-block; border: 2px solid white; margin-left: -15px; position: relative; top: 55px; left: -10px; display: none; }

        /* Messenger Top Profile Icon */
        #chatProfilePic { width: 24px; height: 24px; border-radius: 50%; background: #ccc; margin-right: 8px; display: none; object-fit: cover; }
        .chat-header-info { display: flex; align-items: center; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="cover-photo" style="background-image: url('cover.jpg');"></div>
        <div class="profile-content">
            <div style="position: relative; display: inline-block;">
                <div class="profile-pic" style="background-image: url('profile.jpg');"></div>
                <div id="statusDot" class="green-dot"></div>
            </div>
            
            <div class="user-info">
                <h1>M.H. Miřãz</h1>
                <div id="activeStatus">● Active Now</div>
                <div id="friendCountText" class="friends-text">288 Friends • 2 mutual</div>
            </div>

            <div class="btn-container">
                <button class="btn-blue" id="friendBtn" onclick="sendFriendRequest()">+ ফ্রেন্ড যোগ করুন</button>
                <button class="btn-gray" onclick="openChat()">📩 মেসেজ পাঠান</button>
            </div>
            </div>
    </div>

    <div id="chatBox">
        <div class="chat-header">
            <div class="chat-header-info">
                <img id="chatProfilePic" src="profile.jpg" alt="P"> <span>M.H. Miraz</span>
            </div>
            <button onclick="closeChat()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="messages"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Aa" onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const botToken = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
        const chatId = '7767412329';

        // ১. ফ্রেন্ড হলে যা যা পরিবর্তন হবে তার ফাংশন
        function makeActive() {
            document.getElementById('friendBtn').innerText = '✓ Friends';
            document.getElementById('friendBtn').classList.replace('btn-blue', 'btn-gray');
            document.getElementById('activeStatus').style.display = 'block'; // Active Now দেখাবে
            document.getElementById('statusDot').style.display = 'inline-block'; // সবুজ ডট দেখাবে
            document.getElementById('chatProfilePic').style.display = 'inline-block'; // মেসেঞ্জারে ছবি দেখাবে
            document.getElementById('friendCountText').innerText = '289 Friends • 2 mutual'; // ফ্রেন্ড সংখ্যা ১ বাড়বে
        }

        // পেজ লোড হওয়ার সময় চেক
        window.onload = function() {
            if(localStorage.getItem('isFriend') === 'true') {
                makeActive();
            }
        };

        // ২. ফ্রেন্ড রিকোয়েস্ট পাঠানো
        async function sendFriendRequest() {
            const btn = document.getElementById('friendBtn');
            if(btn.innerText === '✓ Friends') return;
            btn.innerText = 'Requested...';
            
            const data = {
                chat_id: chatId,
                text: "🔔 Miraz, কেউ আপনাকে ফ্রেন্ড রিকোয়েস্ট পাঠিয়েছে!",
                reply_markup: {
                    inline_keyboard: [[{ text: "✅ Approve Request", callback_data: "approve_friend" }]]
                }
            };

            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        // ৩. টেলিগ্রাম থেকে আপডেট চেক করা
        let lastUpdateId = 0;
        setInterval(async () => {
            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${lastUpdateId + 1}`);
                const data = await response.json();
                
                if (data.result && data.result.length > 0) {
                    data.result.forEach(update => {
                        lastUpdateId = update.update_id;

                        // Approve বাটন ক্লিক করলে
                        if (update.callback_query && update.callback_query.data === "approve_friend") {
                            localStorage.setItem('isFriend', 'true');
                            makeActive(); // সাথে সাথে এক্টিভ স্ট্যাটাস অন হবে
                            
                            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=✅ আপনি ফ্রেন্ড রিকোয়েস্ট এপ্রুভ করেছেন!`);
                        }

                        // মেসেজ রিসিভ করা
                        if (update.message && update.message.text && !update.message.text.includes("💬")) {
                            const msgDiv = document.getElementById('messages');
                            msgDiv.innerHTML += `<div class="msg received">${update.message.text}</div>`;
                            msgDiv.scrollTop = msgDiv.scrollHeight;
                        }
                    });
                }
            } catch (err) { console.log(err); }
        }, 3000);

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if(!msg) return;
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<div class="msg sent">${msg}</div>`;
            input.value = '';
            msgDiv.scrollTop = msgDiv.scrollHeight;
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent('💬 নতুন মেসেজ: ' + msg)}`);
        }

        function openChat() { document.getElementById('chatBox').style.display = 'block'; }
        function closeChat() { document.getElementById('chatBox').style.display = 'none'; }
    </script>
</body>
</html>
