<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.H. Miraz | Profile</title>
    <style>
        /* আগের সব প্রোফাইল স্টাইল একই থাকবে */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f2f5; }
        .header { background: white; padding-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); text-align: center; }
        .cover { width: 100%; height: 180px; background: #ddd url('cover.jpg') center/cover; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
        .profile-pic { width: 140px; height: 140px; border-radius: 50%; border: 4px solid white; background: #ccc url('profile.jpg') center/cover; margin-top: -70px; display: inline-block; }
        .btns { display: flex; justify-content: center; gap: 8px; margin: 15px 0; }
        .btn-b { background: #1877f2; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-g { background: #e4e6eb; color: black; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }

        /* Messenger Full Screen UI */
        #chatBox { display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; flex-direction: column; }
        .chat-h { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        #msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .m { padding: 8px 14px; border-radius: 18px; font-size: 15px; max-width: 75%; }
        .s { background: #0084ff; color: white; align-self: flex-end; }
        .r { background: #f1f0f0; color: black; align-self: flex-start; }

        /* Input Bar with File & Emoji */
        .inp-bar { padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #eee; background: white; }
        .inp-bar input[type="text"] { flex: 1; border: none; background: #f0f2f5; padding: 10px 15px; border-radius: 20px; outline: none; }
        .icon-btn { color: #0084ff; font-size: 22px; cursor: pointer; }
        
        /* Emoji Mini Panel */
        #emojiBox { display: none; padding: 10px; background: #f9f9f9; border-top: 1px solid #eee; display: flex; gap: 10px; overflow-x: auto; }
        .emoji-item { cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="cover"></div>
        <div class="profile-pic"></div>
        <h1 style="margin-top:10px;">M.H. Miřãz</h1>
        <div class="btns">
            <button id="friendBtn" class="btn-b" onclick="sendReq()">+ Add Friend</button>
            <button class="btn-g" onclick="showChat()">📩 Message</button>
        </div>
    </div>

    <div id="chatBox">
        <div class="chat-h">
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:24px; color:#0084ff;" onclick="hideChat()">←</span>
                <img src="profile.jpg" style="width:35px; height:35px; border-radius:50%;">
                <span style="font-weight:bold;">M.H. Miraz</span>
            </div>
            <div style="color:#0084ff; font-size:20px;">📞 &nbsp; 📹</div>
        </div>
        
        <div id="msgs"></div>

        <div id="emojiBox">
            <span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
            <span class="emoji-item" onclick="addEmoji('😂')">😂</span>
            <span class="emoji-item" onclick="addEmoji('😮')">😮</span>
            <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
            <span class="emoji-item" onclick="addEmoji('🌸')">🌸</span>
            <span class="emoji-item" onclick="addEmoji('👍')">👍</span>
        </div>

        <div class="inp-bar">
            <label for="fileInp" class="icon-btn">📁</label>
            <input type="file" id="fileInp" style="display:none;" onchange="sendFile()">
            
            <span class="icon-btn" onclick="toggleEmoji()">😊</span>
            
            <input type="text" id="uInp" placeholder="Aa" onkeypress="if(event.key==='Enter') sendM()">
            <span class="icon-btn" onclick="sendM()">➤</span>
        </div>
    </div>

    <script>
        const token = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
        const cid = '7767412329';

        function showChat() { document.getElementById('chatBox').style.display = 'flex'; }
        function hideChat() { document.getElementById('chatBox').style.display = 'none'; }
        function toggleEmoji() { 
            const eb = document.getElementById('emojiBox');
            eb.style.display = (eb.style.display === 'flex') ? 'none' : 'flex';
        }
        function addEmoji(e) { document.getElementById('uInp').value += e; }

        // ১. টেক্সট মেসেজ পাঠানো
        async function sendM() {
            const i = document.getElementById('uInp');
            const v = i.value.trim();
            if(!v) return;
            addMsg(v, 's');
            i.value = '';
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${cid}&text=${encodeURIComponent('💬 '+v)}`);
        }

        // ২. ফাইল/ছবি পাঠানো (টেলিগ্রামে যাবে)
        async function sendFile() {
            const fileInput = document.getElementById('fileInp');
            const file = fileInput.files[0];
            if(!file) return;

            addMsg("Sending file...", 's');
            const formData = new FormData();
            formData.append('chat_id', cid);
            formData.append('document', file);

            try {
                await fetch(`https://api.telegram.org/bot${token}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                addMsg("✅ File Sent to Miraz", 's');
            } catch (e) { alert("ফাইল পাঠাতে সমস্যা হয়েছে।"); }
        }

        function addMsg(t, type) {
            const m = document.getElementById('msgs');
            m.innerHTML += `<div class="m ${type}">${t}</div>`;
            m.scrollTop = m.scrollHeight;
        }

        // ৩. টেলিগ্রাম থেকে মেসেজ রিসিভ করা
        let lastId = 0;
        setInterval(async () => {
            try {
                const r = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=${lastId + 1}`);
                const d = await r.json();
                if (d.result) {
                    d.result.forEach(u => {
                        lastId = u.update_id;
                        if (u.message && u.message.text && !u.message.text.includes("💬")) {
                            addMsg(u.message.text, 'r');
                        }
                    });
                }
            } catch(e){}
        }, 3000);
    </script>
</body>
</html>
