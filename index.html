<style>
    /* নতুন চ্যাট এম্পটি স্টাইল */
    .empty-chat {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 50px;
        color: #1c1e21;
    }
    .empty-p-img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
    }
    .empty-name { font-size: 20px; font-weight: bold; }
    .empty-sub { font-size: 13px; color: #65676b; margin-top: 5px; }
    .encryption-text {
        font-size: 11px;
        color: #8a8d91;
        margin-top: 20px;
        padding: 0 40px;
        line-height: 1.4;
    }

    /* কুইক রিপ্লাই বাটন */
    .quick-replies {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 40px;
        overflow-x: auto;
        width: 100%;
        padding: 0 10px;
    }
    .q-btn {
        background: white;
        border: 1px solid #ddd;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
    }
</style>

<div id="chatBox">
    <div class="chat-h">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" style="color:#0084ff;" onclick="hideChat()"></i>
            <img src="profile.jpg" style="width:35px; height:35px; border-radius:50%;">
            <span style="font-weight:bold;">M.H. Miraz</span>
        </div>
        <div class="chat-icons">
            <i class="fas fa-phone-alt"></i>
            <i class="fas fa-video"></i>
            <i class="fas fa-cog"></i>
        </div>
    </div>
    
    <div id="msgs">
        <div id="emptyState" class="empty-chat">
            <img src="profile.jpg" class="empty-p-img">
            <div class="empty-name">M.H. Miraz</div>
            <div class="empty-sub">Using Messenger without Facebook</div>
            <div class="encryption-text">
                Messages and calls are secured with end-to-end encryption. Only people in this chat can read, listen to, or share them. <a href="#" style="color:#0084ff; text-decoration:none;">Learn more.</a>
            </div>
            
            <p style="font-size:12px; color:#8a8d91; margin-top:30px;">Tap a message to send it.</p>
            
            <div class="quick-replies">
                <button class="q-btn" onclick="quickSend('Hey 👋')">Hey 👋</button>
                <button class="q-btn" onclick="quickSend('Hello, Miraz!')">Hello, Miraz!</button>
                <button class="q-btn" onclick="quickSend('Hi Miraz!')">Hi Miraz!</button>
            </div>
        </div>
    </div>

    <div class="inp-bar">
        <i class="fas fa-camera" style="margin-right:5px;"></i>
        <i class="fas fa-image" onclick="document.getElementById('fileInp').click()"></i>
        <i class="fas fa-microphone" style="margin-right:5px;"></i>
        <input type="text" id="uInp" placeholder="Message..." onkeypress="if(event.key==='Enter') sendM()">
        <i class="far fa-smile" onclick="toggleEmoji()"></i>
        <i class="fas fa-thumbs-up" id="likeIcon" style="color:#0084ff; margin-left:5px;" onclick="quickSend('👍')"></i>
    </div>
</div>

<script>
    // কুইক সেন্ড ফাংশন (বাটনে ক্লিক করলে মেসেজ চলে যাবে)
    async function quickSend(text) {
        document.getElementById('emptyState').style.display = 'none'; // প্রথম মেসেজেই এম্পটি স্টেট গায়েব
        addMsg(text, 's');
        await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${cid}&text=${encodeURIComponent('💬 '+text)}`);
    }

    // মেসেজ সেন্ড করার সময় এম্পটি স্টেট হাইড করা
    async function sendM() {
        const i = document.getElementById('uInp');
        const v = i.value.trim();
        if(!v) return;
        
        document.getElementById('emptyState').style.display = 'none'; 
        addMsg(v, 's');
        i.value = '';
        await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${cid}&text=${encodeURIComponent('💬 '+v)}`);
    }
</script>
