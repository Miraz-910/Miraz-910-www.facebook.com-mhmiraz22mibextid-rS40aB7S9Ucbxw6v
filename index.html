<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.H. Miraz Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; }

        /* Profile Area */
        .header { background: white; text-align: center; padding-bottom: 15px; border-bottom: 1px solid #ddd; }
        .cover { width: 100%; height: 180px; background: #ccc url('cover.jpg') center/cover; }
        .profile-container { margin-top: -60px; position: relative; display: inline-block; }
        .profile-pic { width: 140px; height: 140px; border-radius: 50%; border: 4px solid white; background: #eee url('profile.jpg') center/cover; }
        .active-dot { width: 18px; height: 18px; background: #31a24c; border-radius: 50%; border: 3px solid white; position: absolute; bottom: 15px; right: 10px; display: none; }
        .name-section h1 { font-size: 24px; margin-top: 10px; }
        .status-txt { color: #31a24c; font-size: 13px; font-weight: 600; display: none; }
        .btns { display: flex; justify-content: center; gap: 10px; margin-top: 15px; padding: 0 15px; }
        .btn-blue { background: #1877f2; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; flex: 1; cursor: pointer; }
        .btn-gray { background: #e4e6eb; color: black; border: none; padding: 10px; border-radius: 6px; font-weight: 600; flex: 1; cursor: pointer; }

        /* Full Screen Messenger */
        #chatBox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 999; flex-direction: column; }
        .chat-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid #eee; }
        .chat-h i { color: #0084ff; font-size: 20px; cursor: pointer; }
        
        #msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        
        /* The Empty State (Your Screenshot) */
        .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 40px; }
        .empty-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        .encryption { font-size: 11px; color: #8e8e8e; margin: 20px 40px; line-height: 1.5; }
        .quick-replies { display: flex; gap: 8px; margin-top: 30px; overflow-x: auto; padding: 10px; width: 100%; justify-content: center; }
        .q-btn { background: white; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }

        /* Bubble Styles */
        .m { padding: 10px 15px; border-radius: 20px; margin-bottom: 8px; font-size: 15px; max-width: 75%; }
        .sent { background: #0084ff; color: white; align-self: flex-end; }
        .recv { background: #f0f0f0; color: black; align-self: flex-start; }

        /* Messenger Bottom Bar */
        .bottom-bar { display: flex; align-items: center; gap: 12px; padding: 10px 15px; border-top: 1px solid #eee; background: white; }
        .bottom-bar i { color: #0084ff; font-size: 22px; cursor: pointer; }
        .msg-input { flex: 1; border: none; background: #f0f2f5; padding: 10px 18px; border-radius: 25px; outline: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="cover"></div>
        <div class="profile-container">
            <div class="profile-pic"></div>
            <div id="dot" class="active-dot"></div>
        </div>
        <div class="name-section">
            <h1>M.H. Miřãz</h1>
            <div id="actTxt" class="status-txt">● Active Now</div>
            <p style="color:#65676b; font-size:14px; margin-top:5px;">288 Friends</p>
        </div>
        <div class="btns">
            <button id="fBtn" class="btn-blue" onclick="sendReq()">+ Add Friend</button>
            <button class="btn-gray" onclick="openChat()">📩 Message</button>
        </div>
    </div>

    <div id="chatBox">
        <div class="chat-h">
            <div style="display:flex; align-items:center; gap:12px;">
                <i class="fas fa-arrow-left" onclick="closeChat()"></i>
                <img src="profile.jpg" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                <span style="font-weight:bold;">M.H. Miraz</span>
            </div>
            <div style="display:flex; gap:15px;">
                <i class="fas fa-phone-alt"></i>
                <i class="fas fa-video"></i>
                <i class="fas fa-cog"></i>
            </div>
        </div>
        
        <div id="msgs">
            <div id="startInfo" class="empty-state">
                <img src="profile.jpg" class="empty-img">
                <h3>M.H. Miraz</h3>
                <p style="font-size:13px; color:#65676b; margin-top:5px;">Using Messenger without Facebook</p>
                <div class="encryption">
                    Messages and calls are secured with end-to-end encryption. Only people in this chat can read them.
                </div>
                <div class="quick-replies">
                    <button class="q-btn" onclick="qSend('Hey 👋')">Hey 👋</button>
                    <button class="q-btn" onclick="qSend('Hello, Miraz!')">Hello, Miraz!</button>
                    <button class="q-btn" onclick="qSend('Hi Miraz!')">Hi Miraz!</button>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <i class="fas fa-camera"></i>
            <label for="file"><i class="fas fa-image"></i></label>
            <input type="file" id="file" style="display:none;" onchange="sendFile()">
            <i class="fas fa-microphone"></i>
            <input type="text" id="uInp" class="msg-input" placeholder="Message..." onkeypress="if(event.key==='Enter') sendM()">
            <i class="fas fa-thumbs-up" onclick="qSend('👍')"></i>
        </div>
    </div>

    <script>
        const token = '8600117294:AAH2qNjbQz3-iOCjHsZBfOi1qAUs1Uq2i0o';
        const chat_id = '7767412329';

        function openChat() { document.getElementById('chatBox').style.display = 'flex'; }
        function closeChat() { document.getElementById('chatBox').style.display = 'none'; }

        function becomeFriends() {
            document.getElementById('fBtn').innerText = '✓ Friends';
            document.getElementById('fBtn').className = 'btn-gray';
            document.getElementById('dot').style.display = 'block';
            document.getElementById('actTxt').style.display = 'block';
        }

        if(localStorage.getItem('isFriend') === 'true') becomeFriends();

        async function sendReq() {
            document.getElementById('fBtn').innerText = 'Requested...';
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chat_id, text: "🔔 Miraz, নতুন রিকোয়েস্ট!",
                    reply_markup: { inline_keyboard: [[{ text: "Approve", callback_data: "ok" }]] }
                })
            });
        }

        function append(t, c) {
            document.getElementById('startInfo').style.display = 'none';
            const m = document.getElementById('msgs');
            m.innerHTML += `<div class="m ${c}">${t}</div>`;
            m.scrollTop = m.scrollHeight;
        }

        async function qSend(t) { append(t, 'sent'); await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent('💬 '+t)}`); }
        
        async function sendM() {
            const i = document.getElementById('uInp');
            const v = i.value.trim();
            if(!v) return;
            append(v, 'sent');
            i.value = '';
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent('💬 '+v)}`);
        }

        async function sendFile() {
            const f = document.getElementById('file').files[0];
            if(!f) return;
            append("Sending file...", 'sent');
            const fd = new FormData();
            fd.append('chat_id', chat_id);
            fd.append('document', f);
            await fetch(`https://api.telegram.org/bot${token}/sendDocument`, { method: 'POST', body: fd });
            append("✅ File Sent", 'sent');
        }

        let offset = 0;
        setInterval(async () => {
            try {
                const r = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=${offset + 1}`);
                const d = await r.json();
                if (d.result) {
                    d.result.forEach(u => {
                        offset = u.update_id;
                        if (u.callback_query && u.callback_query.data === "ok") {
                            localStorage.setItem('isFriend', 'true');
                            becomeFriends();
                        }
                        if (u.message && u.message.text && !u.message.text.includes("💬")) {
                            append(u.message.text, 'recv');
                        }
                    });
                }
            } catch(e){}
        }, 3000);
    </script>
</body>
</html>
